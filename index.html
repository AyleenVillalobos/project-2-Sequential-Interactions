<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      background-color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #4a3520;
    }

    .background {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      z-index: -1;
    }

    h1 {
      position: relative;
      margin: 0;
      padding: 2rem 1rem;
      text-align: center;
      font-size: clamp(2.5rem, 8vw, 5rem);
      text-shadow: 0 1px 4px rgba(255, 255, 255, 0.8);
    }
  </style>
</head>
<body>
  <img class="background" src="test-image.jpg?v=2" alt="">
  <h1>Hello</h1>
</body>
</html>
