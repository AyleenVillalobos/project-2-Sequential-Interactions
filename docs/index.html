<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Mouse Messenger</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect x=%274%27 y=%278%27 width=%2724%27 height=%2716%27 rx=%272%27 fill=%27%23eee%27 stroke=%27%23555%27 stroke-width=%272%27/%3E%3Cpath d=%27M5 9l11 8 11-8%27 fill=%27none%27 stroke=%27%23555%27 stroke-width=%272%27/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Shared art: the one love letter that persists through every scene -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <!-- 160 x 110 box, centre (80,55) -->
      <g id="letterArt" stroke-linejoin="round" stroke-linecap="round">
        <rect x="10" y="10" width="140" height="90" rx="6" fill="#fff1bd" stroke="#0c0818" stroke-width="3"/>
        <path d="M12 98 L64 56 M148 98 L96 56" fill="none" stroke="#c9a56a" stroke-width="2.4"/>
        <path d="M11 14 L80 66 L149 14" fill="none" stroke="#0c0818" stroke-width="2.6"/>
        <!-- pink/red heart seal on the flap -->
        <path d="M80 80 C 58 66 62 48 80 58 C 98 48 102 66 80 80 Z" fill="#e5475c" stroke="#0c0818" stroke-width="2.6"/>
        <path d="M70 58 q4 -3 7 1" fill="none" stroke="#ffc4d6" stroke-width="2.4"/>
        <!-- cheese stamp with a perforated edge -->
        <rect x="104" y="17" width="40" height="36" fill="#fff" stroke="#0c0818" stroke-width="2.4" stroke-dasharray="3 2.4"/>
        <rect x="109" y="22" width="30" height="26" fill="#ffd98a"/>
        <path d="M113 42 L135 42 L129 28 Z" fill="#fff1bd" stroke="#0c0818" stroke-width="2"/>
        <rect x="113" y="42" width="22" height="7" fill="#f4d35e" stroke="#0c0818" stroke-width="2"/>
        <circle cx="119" cy="45.5" r="1.7" fill="#c46a38"/><circle cx="128" cy="46" r="1.9" fill="#c46a38"/><circle cx="125" cy="35.5" r="1.5" fill="#c46a38"/>
        <!-- paw print -->
        <ellipse cx="36" cy="84" rx="9.5" ry="7.6" fill="#e0708f" stroke="#0c0818" stroke-width="2"/>
        <ellipse cx="22" cy="72" rx="3.8" ry="4.6" fill="#e0708f" stroke="#0c0818" stroke-width="1.8" transform="rotate(-24 22 72)"/>
        <ellipse cx="31" cy="66" rx="3.8" ry="4.8" fill="#e0708f" stroke="#0c0818" stroke-width="1.8" transform="rotate(-8 31 66)"/>
        <ellipse cx="42" cy="66" rx="3.8" ry="4.8" fill="#e0708f" stroke="#0c0818" stroke-width="1.8" transform="rotate(8 42 66)"/>
        <ellipse cx="51" cy="72" rx="3.8" ry="4.6" fill="#e0708f" stroke="#0c0818" stroke-width="1.8" transform="rotate(24 51 72)"/>
        <path d="M28 28 q5 -4 10 0 t10 0 t10 0" fill="none" stroke="#c9a56a" stroke-width="2.2"/>
      </g>
    </defs>
  </svg>

  <main id="stage" aria-label="A mouse carries a love letter from one cat to another">
    <div id="title" aria-live="polite"><span></span></div>
    <button id="reset" type="button" aria-label="Restart from the beginning">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v4.5h4.5"/></svg>
    </button>
    <button id="replay" type="button">Play again</button>
    <div id="iris"></div>
  </main>

  <script src="js/core.js?v=10"></script>
  <script src="js/pixel.js?v=10"></script>
  <script src="js/art.js?v=10"></script>
  <script src="js/scene-intro.js?v=10"></script>
  <script src="js/scene-route.js?v=10"></script>
  <script src="js/scene-fling.js?v=10"></script>
  <script src="js/main.js?v=10"></script>
</body>
</html>
