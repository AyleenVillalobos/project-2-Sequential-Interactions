<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Mouse Messenger</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect x=%274%27 y=%278%27 width=%2724%27 height=%2716%27 rx=%272%27 fill=%27%23eee%27 stroke=%27%23555%27 stroke-width=%272%27/%3E%3Cpath d=%27M5 9l11 8 11-8%27 fill=%27none%27 stroke=%27%23555%27 stroke-width=%272%27/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Shared art: the one love letter that persists through every scene -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <!-- 160 x 110 box, centre (80,55) -->
      <g id="letterArt">
        <rect x="10" y="10" width="140" height="90" rx="6" fill="#ededed" stroke="#666" stroke-width="2"/>
        <path d="M12 98 L64 56 M148 98 L96 56" fill="none" stroke="#a5a5a5" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M11 14 L80 64 L149 14" fill="none" stroke="#666" stroke-width="2" stroke-linejoin="round"/>
        <path d="M80 72 C 66 62 70 50 80 58 C 90 50 94 62 80 72 Z" fill="#707070" stroke="#555" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M30 26 q5 -4 10 0 t10 0 t10 0 M30 33 q5 -4 10 0 t10 0 t10 0" fill="none" stroke="#b0b0b0" stroke-width="1.3" stroke-linecap="round"/>
        <rect x="108" y="18" width="32" height="27" fill="#fbfbfb" stroke="#8a8a8a" stroke-width="1.6" stroke-dasharray="2.4 1.8"/>
        <rect x="111.5" y="21.5" width="25" height="20" fill="none" stroke="#c8c8c8" stroke-width="0.8"/>
        <polygon points="114,32 134,32 129,25" fill="#e2e2e2" stroke="#666" stroke-width="1" stroke-linejoin="round"/>
        <rect x="114" y="32" width="20" height="7" rx="0.8" fill="#c4c4c4" stroke="#666" stroke-width="1"/>
        <circle cx="118.5" cy="35.5" r="1.3" fill="#9e9e9e"/>
        <circle cx="128.5" cy="36" r="1.6" fill="#9e9e9e"/>
      </g>
    </defs>
  </svg>

  <main id="stage" aria-label="A mouse carries a love letter from one cat to another">
    <div id="title" aria-live="polite"><span></span></div>
    <button id="reset" type="button" aria-label="Restart from the beginning">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v4.5h4.5"/></svg>
    </button>
    <button id="replay" type="button">Play again</button>
    <div id="iris"></div>
  </main>

  <script src="js/core.js"></script>
  <script src="js/pixel.js"></script>
  <script src="js/scene-intro.js"></script>
  <script src="js/scene-route.js"></script>
  <script src="js/scene-freeze.js"></script>
  <script src="js/scene-fling.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
